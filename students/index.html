<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>سجل الطلاب – الحاسوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3a68;--light:#dfe7f3;--bg:#f3f5f9;--line:#d5dbe6;--muted:#6b7487;--red:#c0392b;
/* حركة بأسلوب أبل: spring مخمّد حرجياً بدون ارتداد كافتراضي، وارتداد خفيف فقط بعد سحب/دفعة */
--spring:linear(0,0.0507,0.1616,0.2918,0.4196,0.5347,0.6331,0.7144,0.78,0.832,0.8727,0.9041,0.9281,0.9463,0.9601,0.9705,0.9782,0.984,0.9882,0.9914,0.9937,0.9954,0.9967,0.9976,1);
--spring-bounce:linear(0,0.0383,0.1302,0.2488,0.3755,0.4982,0.6097,0.7064,0.7871,0.8521,0.9028,0.9411,0.969,0.9884,1.0013,1.0091,1.0134,1.015,1.015,1.0139,1.0122,1.0103,1.0084,1.0067,1.0051,1.0038,1.0027,1.0018,1.0011,1.0006,1);
--dur:.4s}
@supports not (transition-timing-function:linear(0,1)){:root{--spring:cubic-bezier(.2,.8,.2,1);--spring-bounce:cubic-bezier(.3,1.25,.5,1)}}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:#16202e;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
header.top{background:var(--navy);color:#fff;height:50px;padding:0 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header.top h1{font-size:17px;margin:0;font-weight:800;flex:1}
#sync{font-size:12px;background:#ffffff22;padding:3px 10px;border-radius:20px;white-space:nowrap}
#sync.ok{background:#27ae6044}#sync.error{background:#e74c3c66}#sync.pending{background:#f1c40f44}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:4}
nav button{flex:1;white-space:nowrap;font-size:14px;border:0;background:none;padding:11px 4px;font-weight:700;color:var(--muted);cursor:pointer;transition:color .2s}
nav button.on{color:var(--navy)}
/* مؤشر واحد ينزلق بين التبويبات بدل خط يختفي ويظهر */
#tabbar{position:absolute;bottom:0;left:0;height:3px;width:0;background:var(--navy);border-radius:3px 3px 0 0;transition:transform var(--dur) var(--spring),width var(--dur) var(--spring)}
#view.enter{animation:viewIn .22s ease-out}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
main{max-width:900px;margin:0 auto;padding:14px 12px 80px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.sm{font-size:12.5px}.center{text-align:center}
input,select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #1f3a6855;border-color:var(--navy)}
label{font-size:13px;color:var(--muted);display:block;margin:8px 0 3px}
.box input:not([type=checkbox]),.box select{width:100%}
.row input,.row select{width:auto}
#q{width:100%;font-size:16px;padding:11px 14px;border-radius:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip{transition:background-color .2s,color .2s,border-color .2s,transform .32s var(--spring)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-block}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;padding:4px 0}
.link.danger{color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.card:active{background:#f7f9fc}
.nm{font-weight:700}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.b{--c:#888;font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:20px;padding:1px 8px;white-space:nowrap}
.fin{min-width:46px;text-align:center;font-weight:800;font-size:18px;color:var(--navy);background:var(--light);border-radius:10px;padding:6px 4px}
.fin.low{color:var(--red);background:#fbe5e2}
/* ملف الطالب: لوح يصعد من الأسفل ويرجع لنفس المكان، ويُسحب للأسفل للإغلاق */
#modal{position:fixed;inset:0;background:rgba(10,18,32,0);z-index:20;visibility:hidden;pointer-events:none;transition:background-color .3s ease,visibility 0s linear .45s}
#modal.show{visibility:visible;pointer-events:auto;background:rgba(10,18,32,.45);transition:background-color .3s ease}
.sheet{position:absolute;inset:max(10px,env(safe-area-inset-top)) 0 0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);max-width:900px;margin:0 auto;padding-bottom:60px;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px #0003;transform:translateY(105%);transition:transform var(--dur) var(--spring);will-change:transform}
#modal.show .sheet{transform:none}
.sheet.drag{transition:none}
.sh-head{background:var(--navy);color:#fff;padding:16px 14px 12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:2;border-radius:16px 16px 0 0;touch-action:none;cursor:grab}
.sh-head::before{content:'';position:absolute;top:6px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:#ffffff59}
.sh-head h2{margin:0;font-size:18px}
.sh-head .muted{color:#c9d4ea}
.sheet .box{margin:12px}
.icon{background:#ffffff22;border:0;color:inherit;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex:none}
.box .icon{background:#f0f2f6;width:32px;height:32px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-top:8px}
.tbtn{--c:#888;border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:10px;padding:10px 6px;font-weight:700;cursor:pointer}
.tbtn:active{background:var(--c);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
.cnt{--c:#888;border-radius:10px;background:color-mix(in srgb,var(--c) 9%,#fff);padding:8px;text-align:center}
.cnt b{display:block;font-size:22px;color:var(--c);line-height:1.2}
.cnt span{font-size:12px;color:#333}
.exam{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
.gcell label{margin:0 0 2px;font-size:12px}
.gcell input{width:100%;text-align:center;font-weight:700}
.gcell .val{border-radius:10px;background:#f0f2f6;padding:9px;text-align:center;font-weight:700;min-height:42px}
.gcell.f .val{background:var(--light);color:var(--navy);font-weight:800}
.note{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eef0f4;padding:8px 0;flex-wrap:wrap}
.note:last-child{border:0}
.rrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:7px}
.rn{font-weight:700;margin-bottom:6px}
.rbtns{display:flex;gap:5px;flex-wrap:wrap}
.rb{--c:#888;border:1.5px solid color-mix(in srgb,var(--c) 45%,#fff);color:var(--c);background:#fff;border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px;cursor:pointer}
.rb.on{background:var(--c);color:#fff;border-color:var(--c)}
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tbl th{background:var(--navy);color:#fff;padding:7px 4px;font-weight:700;position:sticky;top:0}
.tbl td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.tbl td.l{text-align:right;white-space:nowrap;padding:6px 8px}
.tbl th{white-space:nowrap}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px) scale(.96);opacity:0;background:#16202e;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;transition:transform var(--dur) var(--spring),opacity .2s;font-weight:600;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1}

/* استجابة فورية للمس: ينضغط فوراً، ويرجع بـ spring */
.btn,.chip,.tbtn,.rb,.icon,.card,nav button,.link{transition-property:transform,background-color,color,border-color;transition-duration:.32s;transition-timing-function:var(--spring)}
.btn:active,.chip:active,.tbtn:active,.rb:active,.icon:active,nav button:active{transform:scale(.95);transition-duration:.06s}
.card:active{transform:scale(.985);transition-duration:.06s}
@media (hover:hover) and (pointer:fine){.card:hover{border-color:#b9c3d4}.btn:hover{filter:brightness(1.08)}}
.rb.pop{animation:pop .45s var(--spring-bounce)}
@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
.cnt.bump b{animation:bump .5s var(--spring-bounce)}
@keyframes bump{from{transform:scale(1.35)}to{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
  :root{--dur:.01s}
  *,*::before,*::after{animation-duration:.01s!important}
  .btn:active,.chip:active,.tbtn:active,.rb:active,.icon:active,nav button:active,.card:active{transform:none}
  .sheet{transform:none;opacity:0;transition:opacity .2s}
  #modal.show .sheet{opacity:1}
}
.empty{text-align:center;padding:40px 16px}
.typerow{display:flex;gap:6px;flex-wrap:wrap}
.hint{background:#fff8e1;border:1px solid #f3dd8e;border-radius:10px;padding:10px;font-size:13px;line-height:1.8}
#print{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:12.5px;color:#000}
  @page{size:A4;margin:12mm}
  .ph{display:flex;justify-content:space-between;font-weight:800;color:var(--navy);font-size:15px;border-bottom:3px solid var(--navy);padding-bottom:8px;margin-bottom:10px}
  .pt{width:100%;border-collapse:collapse;margin-bottom:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt th{background:var(--navy)!important;color:#fff;padding:5px 3px;border:1px solid var(--navy)}
  .pt td{border:1px solid #8a94a6;padding:4px 3px;text-align:center}
  .pt td.l{text-align:right;padding-right:8px}
  h4{color:var(--navy);margin:12px 0 6px}
  .sign{display:flex;justify-content:space-between;margin-top:40px;font-weight:700;color:var(--navy)}
}

/* ================= تصميم بأسلوب أبل (الشاشة فقط — الطباعة بقيت كما هي) ================= */
@media screen{
:root{--a-bg:#f5f5f7;--a-card:#fff;--a-text:#1d1d1f;--a-sec:#6e6e73;--a-sep:rgba(60,60,67,.18);--a-fill:rgba(118,118,128,.12);--a-blue:#0071e3;--a-red:#ff3b30;--a-glass:rgba(245,245,247,.78);--a-thumb:#fff;--a-tint:255,255,255}
@media (prefers-color-scheme:dark){:root{--a-bg:#000;--a-card:#1c1c1e;--a-text:#f5f5f7;--a-sec:#98989d;--a-sep:rgba(84,84,88,.6);--a-fill:rgba(118,118,128,.24);--a-blue:#0a84ff;--a-red:#ff453a;--a-glass:rgba(22,22,24,.72);--a-thumb:#636366;--a-tint:28,28,30}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"SF Arabic","SF Pro Text","Segoe UI",Cairo,sans-serif;background:var(--a-bg);color:var(--a-text);font-size:16px;letter-spacing:-.01em;min-height:100dvh;-webkit-font-smoothing:antialiased;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* شريط علوي زجاجي + عنوان كبير */
header.top{background:var(--a-glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--a-text);height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0}
header.top h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
#sync{background:var(--a-fill);color:var(--a-sec);font-size:12px;font-weight:600;padding:4px 10px}
#sync.ok{background:rgba(52,199,89,.16);color:#248a3d}#sync.error{background:rgba(255,59,48,.14);color:var(--a-red)}#sync.pending{background:rgba(255,149,0,.16);color:#c93400}
/* التبويبات: Segmented Control */
nav{top:calc(54px + env(safe-area-inset-top));background:var(--a-glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--a-sep);padding:4px 14px 10px}
nav::before{content:'';position:absolute;top:4px;bottom:10px;left:12px;right:12px;background:var(--a-fill);border-radius:10px}
nav button{position:relative;z-index:1;font-size:14px;font-weight:600;color:var(--a-text);padding:7px 2px;min-height:34px;border-radius:8px;opacity:.7}
nav button.on{color:var(--a-text);opacity:1}
#tabbar{top:6px;bottom:12px;height:auto;background:var(--a-thumb);border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
main{max-width:1000px;padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
/* البطاقات والمجموعات */
.box{background:var(--a-card);border:0;border-radius:16px;padding:16px;margin-bottom:16px}
.box h3{color:var(--a-text);font-size:17px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--a-sec)}
label{color:var(--a-sec);font-size:13px}
/* الحقول: خط 16px حتى الآيفون ما يكبّر الشاشة */
input,select,textarea{font-size:16px!important;background:var(--a-fill)!important;border:0!important;border-radius:10px!important;color:var(--a-text);min-height:42px;-webkit-appearance:none;appearance:none}
input[type=checkbox]{min-height:0;-webkit-appearance:auto;appearance:auto;width:18px;height:18px;accent-color:var(--a-blue)}
select{padding-left:30px!important;background-image:linear-gradient(45deg,transparent 50%,var(--a-sec) 50%),linear-gradient(135deg,var(--a-sec) 50%,transparent 50%)!important;background-position:14px 52%,19px 52%!important;background-size:5px 5px!important;background-repeat:no-repeat!important}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--a-blue) 35%,transparent);outline-offset:0}
#q{background:var(--a-fill)!important;border-radius:12px!important;padding:11px 14px!important}
/* الفلاتر */
.chips{gap:8px;padding:12px 0 4px}
.chip{background:var(--a-fill);border:0;color:var(--a-text);padding:7px 15px;font-weight:600;font-size:14px;min-height:34px}
.chip.on{background:var(--a-blue);color:#fff}
/* الأزرار */
.btn{background:var(--a-blue);border-radius:980px;padding:10px 20px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:color-mix(in srgb,var(--a-blue) 12%,transparent);color:var(--a-blue);border:0}
.btn.danger{background:var(--a-red)}
.btn.sm{padding:7px 14px;font-size:14px;min-height:34px}
.link{color:var(--a-blue);text-decoration:none;font-weight:600;min-height:36px}
.link.danger{color:var(--a-red)}
/* قائمة الطلاب: Inset Grouped مثل إعدادات الآيفون */
#list{background:var(--a-card);border-radius:16px;overflow:hidden}
#list:empty{display:none}
#list>.box,#list>p{margin:0}
.card{background:var(--a-card);border:0;border-radius:0;margin:0;padding:12px 16px;min-height:60px;position:relative}
.card+.card::before{content:'';position:absolute;top:0;right:16px;left:0;border-top:.5px solid var(--a-sep)}
.card::after{content:'';flex:none;width:8px;height:8px;border-left:2px solid #c7c7cc;border-bottom:2px solid #c7c7cc;transform:rotate(45deg);margin-right:2px}
.card:active{background:var(--a-fill)}
.nm{font-weight:600;font-size:16px}
.fin{background:var(--a-fill);color:var(--a-text);border-radius:10px;font-size:17px;font-weight:700}
.fin.low{background:color-mix(in srgb,var(--a-red) 14%,transparent);color:var(--a-red)}
.b{background:color-mix(in srgb,var(--c) 14%,transparent);border:0;font-weight:600;padding:2px 8px}
/* ملف الطالب */
.sheet{background:var(--a-bg);border-radius:14px 14px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sh-head{background:var(--a-glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--a-text);border-radius:14px 14px 0 0;border-bottom:.5px solid var(--a-sep);padding:18px 16px 12px}
.sh-head::before{background:color-mix(in srgb,var(--a-sec) 45%,transparent)}
.sh-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sh-head .muted{color:var(--a-sec)}
.icon{background:var(--a-fill);color:var(--a-sec);width:32px;height:32px;border-radius:50%;font-size:14px;font-weight:700}
.box .icon{background:transparent;width:36px;height:36px}
.sheet .box{margin:16px}
.tgrid{gap:8px}
.tbtn{border:0;background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:12px;font-weight:600;min-height:44px}
.cnt{background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:12px;padding:10px 6px}
.cnt b{font-size:24px;font-weight:700}
.cnt span{color:var(--a-sec)}
.exam{border:0;background:var(--a-bg);border-radius:12px;padding:12px}
.gcell .val{background:var(--a-fill);border-radius:10px}
.gcell.f .val{background:color-mix(in srgb,var(--a-blue) 14%,transparent);color:var(--a-blue)}
.note{border-bottom:.5px solid var(--a-sep);padding:10px 0}
/* التسجيل اليومي */
.rrow{background:var(--a-card);border:0;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rn{font-weight:600}
.rbtns{gap:6px}
.rb{border:0;background:color-mix(in srgb,var(--c) 11%,transparent);border-radius:980px;padding:7px 12px;font-weight:600;font-size:14px;min-height:36px}
.rb.on{background:var(--c);color:#fff}
/* الجداول */
.tblwrap{border:0;border-radius:16px;background:var(--a-card)}
.tbl{background:var(--a-card);font-size:14px}
.tbl th{background:var(--a-card);color:var(--a-sec);font-weight:600;font-size:12.5px;border-bottom:.5px solid var(--a-sep);padding:10px 6px}
.tbl td{border:0;border-bottom:.5px solid var(--a-sep);padding:10px 6px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-act]:active td{background:var(--a-fill)}
.hint{background:rgba(255,204,0,.14);border:0;border-radius:12px;color:var(--a-text)}
#toast{background:rgba(var(--a-tint),.86);color:var(--a-text);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:15px}
textarea{padding:10px 12px!important}
.fin:empty{visibility:hidden}
/* الوضع الليلي: تفتيح ألوان الحالات حتى تنقرأ على الخلفية السوداء */
@media (prefers-color-scheme:dark){
  .tbtn,.b,.rb:not(.on),.cnt b{color:color-mix(in srgb,var(--c) 55%,#fff)!important}
  .tbtn,.cnt,.rb:not(.on){background:color-mix(in srgb,var(--c) 22%,transparent)}
  .exam{background:#2c2c2e}
}
/* الشاشات الكبيرة */
@media (min-width:760px){
  header.top{padding-left:max(24px,calc((100% - 1000px)/2 + 16px));padding-right:max(24px,calc((100% - 1000px)/2 + 16px))}
  nav{padding-left:max(14px,calc((100% - 600px)/2));padding-right:max(14px,calc((100% - 600px)/2))}
  nav::before{left:max(12px,calc((100% - 600px)/2 - 2px));right:max(12px,calc((100% - 600px)/2 - 2px))}
  .sheet{top:40px;border-radius:14px;bottom:20px;max-width:760px}
  .sh-head{border-radius:14px 14px 0 0}
}
}
</style>
</head>
<body>
<header class="top"><h1 id="apptitle">سجل الطلاب</h1><span id="sync">محلي فقط</span></header>
<nav>
  <button data-act="go" data-v="students">الطلاب</button>
  <button data-act="go" data-v="register">تسجيل يومي</button>
  <button data-act="go" data-v="reports">التقارير</button>
  <button data-act="go" data-v="settings">الإعدادات</button>
  <span id="tabbar"></span>
</nav>
<main id="view"></main>
<div id="modal"></div>
<div id="toast"></div>
<div id="print"></div>

<script>
/* ===== أدوات عامة ===== */
const APP_VERSION='2026-11-28.7';
const CFG=Object.assign({key:'qawafi',title:'سجل طلاب الحاسوب',subject:'الحاسوب',teacher:'محمد محمود',mode:'full',repo:'students-data',path:'data.json',grade:''},window.APP_CONFIG||{});
const SINGLE=CFG.mode==='single';
const LS=CFG.key==='qawafi'?'qawafi_students_db_v1':CFG.key+'_db_v1', LSG=CFG.key==='qawafi'?'qawafi_github_v1':CFG.key+'_github_v1';
document.title=CFG.title;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll=new Intl.Collator('ar');
const byName=(a,b)=>coll.compare(a.name,b.name);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtD=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
const num=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;

const DEFAULT_TYPES=[
 {id:'absent',label:'غائب',short:'غائب',color:'#c0392b',neg:1},
 {id:'nobook',label:'لم يحضر الكتاب',short:'كتاب',color:'#d35400',neg:1},
 {id:'nonotebook',label:'لم يحضر الدفتر',short:'دفتر',color:'#ca6f1e',neg:1},
 {id:'nohw',label:'لم يحل الواجب',short:'واجب',color:'#9a7d0a',neg:1},
 {id:'late',label:'تأخر عن الحصة',short:'تأخر',color:'#717d7e',neg:1},
 {id:'expelled',label:'طُرد من الصف',short:'طرد',color:'#922b21',neg:1},
 {id:'behavior',label:'سلوك / إزعاج',short:'سلوك',color:'#6c3483',neg:1},
 {id:'excellent',label:'مشاركة متميزة',short:'متميز',color:'#1e8449',neg:0},
 {id:'note',label:'ملاحظة عامة',short:'ملاحظة',color:'#1f3a68',neg:0}
];
/* جدول اليومي والعملي حسب النظري (نفس نظام جداول الشهر الأول) */
const MAP={5:[60,30],10:[65,32],15:[70,33],20:[74,34],25:[78,35],30:[83,36],35:[87,37],40:[92,38],45:[96,39],50:[100,40],55:[100,40],60:[100,40]};
const GRADE_ORDER=['الأول','الثاني','الثالث'];

let DB=null, GH={}, ghSha=null, saveTimer=null, curId=null;
try{GH=JSON.parse(localStorage.getItem(LSG)||'{}')}catch(e){GH={}}
let S={view:'students',grade:'all',section:'all',q:'',sort:'name',regGrade:null,regSection:null,regDate:today(),repGrade:null,repSection:'all',repExam:null,repMode:'grades',noteView:'type'};

/* ===== البيانات ===== */
function ensure(d){
  d.version=d.version||1;
  d.settings=Object.assign({school:'متوسطة القوافي الأهلية للبنين',subject:CFG.subject,teacher:CFG.teacher},d.settings||{});
  if(!Array.isArray(d.types)||!d.types.length) d.types=JSON.parse(JSON.stringify(DEFAULT_TYPES));
  if(!Array.isArray(d.exams)||!d.exams.length) d.exams=[{id:'m1',name:'امتحان الشهر الأول'}];
  d.students=(d.students||[]).map(s=>Object.assign({notes:[],scores:{}},s,{id:s.id||uid()}));
  return d;
}
function load(){try{const r=localStorage.getItem(LS);if(r)DB=ensure(JSON.parse(r))}catch(e){DB=null}}
function persist(){DB.updatedAt=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(DB));scheduleGH()}
const T=id=>DB.types.find(t=>t.id===id)||{id,label:id,short:id,color:'#888',neg:0};
const stu=id=>DB.students.find(s=>s.id===id);
function counts(s){const c={};for(const n of s.notes)c[n.type]=(c[n.type]||0)+1;return c}
const negTotal=s=>s.notes.filter(n=>T(n.type).neg).length;
const lastExam=()=>DB.exams[DB.exams.length-1];
function gradesList(){const g=[...new Set(DB.students.map(s=>s.grade))];return g.sort((a,b)=>{const ia=GRADE_ORDER.indexOf(a),ib=GRADE_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||coll.compare(a,b)})}
function sectionsOf(g){return [...new Set(DB.students.filter(s=>g==='all'||s.grade===g).map(s=>s.section))].sort(coll.compare)}
function filtered(g,sec,q){const nq=norm(q||'');return DB.students.filter(s=>(g==='all'||s.grade===g)&&(sec==='all'||s.section===sec)&&(!nq||norm(s.name).includes(nq)))}
function calc(sc){
  if(!sc)return null;
  if(sc.status==='غ')return{d:'غ',t:'غ',p:'غ',m:'غ',f:'غ'};
  if(sc.status==='نقل')return{d:'نقل',t:'نقل',p:'نقل',m:'نقل',f:sc.final??''};
  if(SINGLE){const f=num(sc.final);return{d:'',t:'',p:'',m:'',f:f??''}}
  const d=num(sc.daily),t=num(sc.theory),p=num(sc.practical);
  if(d===null||t===null||p===null)return{d:d??'',t:t??'',p:p??'',m:'',f:''};
  const m=t+p;return{d,t,p,m,f:Math.floor((d+m)/2+0.5)};
}
const finOf=(s,exId)=>{const c=calc(s.scores?.[exId]);return c?c.f:''};
const finClass=f=>(typeof f==='number'&&f<50)?'low':'';

/* ===== GitHub ===== */
const ghOK=()=>GH.owner&&GH.repo&&GH.token;
const hdr=()=>({Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','Content-Type':'application/json'});
const ghURL=()=>`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${(GH.path||CFG.path).split('/').map(encodeURIComponent).join('/')}`;
const b64e=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function ghFetch(){
  const r=await fetch(ghURL()+'?ref='+encodeURIComponent(GH.branch||'main')+'&_='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(r.status===404){
    const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}`,{headers:hdr(),cache:'no-store'});
    if(!rr.ok)throw new Error('لا أستطيع الوصول إلى المستودع '+GH.owner+'/'+GH.repo+' — تأكد من كتابة اسم الحساب والمستودع، وأن التوكن مسموح له بمستودع students-data وصلاحية Contents: Read and write');
    ghSha=null;return null}
  if(!r.ok)throw new Error(r.status===401?'التوكن غير صحيح':'خطأ GitHub '+r.status);
  const j=await r.json();ghSha=j.sha;
  if(!j.content)throw new Error('الملف كبير جداً للقراءة');
  return ensure(JSON.parse(b64d(j.content)));
}
async function ghPush(){
  const body={message:'تحديث سجل الطلاب '+new Date().toLocaleString('en-GB'),content:b64e(JSON.stringify(DB,null,1)),branch:GH.branch||'main'};
  if(ghSha)body.sha=ghSha;
  let r=await fetch(ghURL(),{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422){try{await ghFetch()}catch(e){} if(ghSha)body.sha=ghSha; r=await fetch(ghURL(),{method:'PUT',headers:hdr(),body:JSON.stringify(body)})}
  if(!r.ok)throw new Error(r.status===401?'التوكن غير صحيح':r.status===404?'المستودع غير موجود أو التوكن لا يملك صلاحية':'خطأ GitHub '+r.status);
  const j=await r.json();ghSha=j.content.sha;
}
function setSync(st,msg){const el=$('#sync');el.className=st;el.textContent=({local:'محلي فقط',pending:'جاري الحفظ…',ok:'محفوظ على GitHub ✓',error:'خطأ بالمزامنة'})[st];el.title=msg||''}
function scheduleGH(){
  if(!ghOK())return;setSync('pending');clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{saveTimer=null;try{await ghPush();setSync('ok')}catch(e){setSync('error',e.message);toast('لم يُحفظ على GitHub: '+e.message)}},1500);
}
async function ghSync(silent){
  if(!ghOK()){setSync('local');return}
  try{
    setSync('pending');
    const r=await ghFetch();
    if(r&&(!DB||(r.updatedAt||'')>(DB.updatedAt||''))){DB=r;localStorage.setItem(LS,JSON.stringify(DB));if(curId)renderProfile();render();if(!silent)toast('تم تحميل آخر نسخة من GitHub')}
    else if(DB&&(!r||(DB.updatedAt||'')>(r.updatedAt||''))){await ghPush();if(!silent)toast('تم رفع البيانات إلى GitHub')}
    setSync('ok');
  }catch(e){setSync('error',e.message);if(!silent)toast(e.message)}
}

/* ===== واجهة ===== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function chips(act,opts,cur){return `<div class="chips">${opts.map(([v,l])=>`<button class="chip ${v===cur?'on':''}" data-act="${act}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`}
function moveTabbar(){
  const b=document.querySelector('nav button.on'),bar=$('#tabbar');if(!b||!bar)return;
  const w=b.offsetWidth;   /* مقبض الـ Segmented Control يغطي التبويب كامل */
  bar.style.width=w+'px';bar.style.transform=`translateX(${b.offsetLeft}px)`;
}
addEventListener('resize',()=>{const bar=$('#tabbar');bar.style.transition='none';moveTabbar();bar.offsetWidth;bar.style.transition=''});
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  moveTabbar();
  if(!DB&&S.view!=='settings'){vEmpty();return}
  ({students:vStudents,register:vRegister,reports:vReports,settings:vSettings})[S.view]();
}
function vEmpty(){
  $('#view').innerHTML=`<div class="box empty"><h3>لا توجد بيانات بعد</h3>
  <p class="muted">اربط مستودع GitHub الذي فيه ملف البيانات، أو استورد ملف <b>data.json</b> من جهازك.</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="go" data-v="settings">ربط GitHub</button>
  <label class="btn ghost">استيراد ملف<input type="file" accept=".json,application/json" hidden data-chg="import"></label></div></div>`;
}

/* --- الطلاب --- */
function vStudents(){
  const secs=S.grade==='all'?[]:sectionsOf(S.grade);
  $('#view').innerHTML=`<input id="q" type="search" placeholder="🔍 ابحث باسم الطالب..." value="${esc(S.q)}" autocomplete="off">
  ${chips('fgrade',[['all','كل الصفوف'],...gradesList().map(g=>[g,'الصف '+g])],S.grade)}
  ${S.grade!=='all'?chips('fsec',[['all','كل الشعب'],...secs.map(x=>[x,'شعبة '+x])],S.section):''}
  <div class="row between"><span id="cnt" class="muted sm"></span>
  <select id="sort"><option value="name">ترتيب أبجدي</option><option value="neg">الأكثر ملاحظات سلبية</option><option value="high">الأعلى درجة</option><option value="low">الأقل درجة</option></select></div>
  <div id="list"></div>`;
  $('#sort').value=S.sort;
  $('#q').oninput=e=>{S.q=e.target.value;renderList()};
  $('#sort').onchange=e=>{S.sort=e.target.value;renderList()};
  renderList();
}
function renderList(){
  const ex=lastExam().id;let arr=filtered(S.grade,S.section,S.q);
  const fv=s=>{const f=finOf(s,ex);return typeof f==='number'?f:-1};
  arr.sort(byName);
  if(S.sort==='neg')arr.sort((a,b)=>negTotal(b)-negTotal(a));
  if(S.sort==='high')arr.sort((a,b)=>fv(b)-fv(a));
  if(S.sort==='low')arr.sort((a,b)=>{const x=fv(a),y=fv(b);return (x<0?999:x)-(y<0?999:y)});
  $('#cnt').textContent=arr.length+' طالب';
  $('#list').innerHTML=arr.map(s=>{
    const c=counts(s),f=finOf(s,ex);
    const badges=DB.types.filter(t=>c[t.id]).map(t=>`<span class="b" style="--c:${t.color}">${esc(t.short)} ${c[t.id]}</span>`).join('');
    return `<div class="card" data-act="open" data-id="${s.id}"><div class="grow"><div class="nm">${esc(s.name)}</div><div class="muted sm">الصف ${esc(s.grade)} – شعبة ${esc(s.section)}</div>${badges?`<div class="badges">${badges}</div>`:''}</div><div class="fin ${finClass(f)}">${esc(f)}</div></div>`;
  }).join('')||(DB.students.length?'<p class="muted center">لا يوجد طلاب بهذا البحث</p>':'<div class="box empty"><h3>لا يوجد طلاب بعد</h3><p class="muted">أضف الطلاب من الإعدادات، ويمكنك لصق القائمة كاملة مرة واحدة.</p><button class="btn" data-act="go" data-v="settings">إضافة الطلاب</button></div>');
}

/* --- ملف الطالب --- */
let closeTimer=null;
function openStudent(id){
  const m=$('#modal'),reopen=m.classList.contains('show')||closeTimer;
  clearTimeout(closeTimer);closeTimer=null;   /* قابل للمقاطعة: فتح أثناء الإغلاق يكمل من مكانه */
  curId=id;
  if(reopen&&$('.sheet')){renderProfile(true)}
  else{renderProfile(true);m.offsetHeight}   /* نثبّت الوضع المغلق أولاً حتى يصعد اللوح */
  m.style.backgroundColor='';m.classList.add('show');document.body.style.overflow='hidden'
}
function closeModal(){
  const m=$('#modal');if(!m.classList.contains('show'))return;
  const sh=$('.sheet');if(sh){sh.classList.remove('drag');sh.style.transform=''}
  m.style.backgroundColor='';m.classList.remove('show');document.body.style.overflow='';curId=null;render();
  clearTimeout(closeTimer);closeTimer=setTimeout(()=>{closeTimer=null;if(!m.classList.contains('show'))m.innerHTML=''},450);
}
/* سحب ملف الطالب للأسفل للإغلاق — يتبع الإصبع، ويحسب سرعة الدفعة */
(function(){
  let y0=0,dy=0,sh=null,pts=[],id=null;
  const m=$('#modal');
  m.addEventListener('pointerdown',e=>{
    const head=e.target.closest('.sh-head');if(!head||e.target.closest('button,input,a,select'))return;
    sh=$('.sheet');if(!sh)return;id=e.pointerId;head.setPointerCapture(id);
    y0=e.clientY;dy=0;pts=[[e.timeStamp,e.clientY]];sh.classList.add('drag');
  });
  m.addEventListener('pointermove',e=>{
    if(!sh||e.pointerId!==id)return;
    const raw=e.clientY-y0;dy=raw>0?raw:raw*.15;   /* مقاومة مطاطية للأعلى */
    sh.style.transform=`translateY(${dy}px)`;
    m.style.backgroundColor=`rgba(10,18,32,${.45*Math.max(0,1-dy/(sh.offsetHeight||800))})`;
    pts.push([e.timeStamp,e.clientY]);if(pts.length>5)pts.shift();
  });
  const end=e=>{
    if(!sh||e.pointerId!==id)return;
    const a=pts[0],b=pts[pts.length-1],v=b&&a&&b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0; /* px/ms */
    const s=sh;sh=null;id=null;s.classList.remove('drag');
    if(dy>140||(v>.5&&dy>10)){closeModal()}
    else{
      s.style.transition='transform .45s var(--spring-bounce)';   /* ارتداد خفيف لأن هناك دفعة سبقته */
      s.style.transform='';m.style.backgroundColor='';
      setTimeout(()=>{s.style.transition=''},460);
    }
  };
  m.addEventListener('pointerup',end);m.addEventListener('pointercancel',end);
  m.addEventListener('click',e=>{if(e.target===m)closeModal()});
})();
function inp(k,l,v,ex,max){return `<div class="gcell"><label>${l}</label><input type="number" inputmode="numeric" min="0" max="${max}" data-chg="score" data-k="${k}" data-ex="${ex}" value="${v??''}"></div>`}
function gradeEditor(s,ex){
  const sc=s.scores?.[ex.id]||{},c=calc(sc)||{},st=sc.status||'';
  return `<div class="exam"><div class="row between" style="margin:0"><b>${esc(ex.name)}</b>
  <select data-chg="status" data-ex="${ex.id}"><option value="" ${st===''?'selected':''}>عادي</option><option value="غ" ${st==='غ'?'selected':''}>غائب (غ)</option><option value="نقل" ${st==='نقل'?'selected':''}>نقل</option></select></div>
  <div class="ggrid">${SINGLE&&st!=='غ'?inp('final','الدرجة /100',sc.final,ex.id,100):st===''?inp('daily','اليومي /100',sc.daily,ex.id,100)+inp('theory','النظري /60',sc.theory,ex.id,60)+inp('practical','العملي /40',sc.practical,ex.id,40)+`<div class="gcell"><label>الامتحان /100</label><div class="val">${esc(c.m??'')}</div></div>`
  :st==='نقل'?inp('final','الدرجة النهائية',sc.final,ex.id,100):''}
  ${st!=='نقل'&&!SINGLE?`<div class="gcell f"><label>النهائية</label><div class="val">${esc(c.f??'')}</div></div>`:''}</div>
  ${st===''&&!SINGLE?`<button class="link sm" data-act="autofill" data-ex="${ex.id}">تعبئة اليومي والعملي تلقائياً من النظري</button>`:''}</div>`;
}
function renderProfile(top){
  const s=stu(curId);if(!s)return closeModal();
  const old=$('.sheet');const sc=old&&!top?old.scrollTop:0;
  const keepText=$('#nText')?.value||'',keepDate=$('#nDate')?.value||today();
  const c=counts(s);
  const notes=[...s.notes].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  $('#modal').innerHTML=`<div class="sheet">
  <div class="sh-head"><button class="icon" data-act="close" aria-label="إغلاق">✕</button><div class="grow"><h2>${esc(s.name)}</h2><div class="muted sm">الصف ${esc(s.grade)} متوسط – شعبة ${esc(s.section)}</div></div><button class="btn ghost sm" data-act="printstu" data-id="${s.id}">🖨 تقرير استدعاء</button></div>
  <section class="box"><h3>إضافة ملاحظة</h3>
    <div class="row" style="margin:0"><input type="date" id="nDate" value="${esc(keepDate)}"><input id="nText" class="grow" placeholder="تفاصيل (اختياري)" value="${esc(keepText)}"></div>
    <div class="tgrid">${DB.types.map(t=>`<button class="tbtn" style="--c:${t.color}" data-act="addnote" data-t="${t.id}">+ ${esc(t.label)}</button>`).join('')}</div></section>
  <section class="box"><h3>الملخص</h3><div class="cgrid">${DB.types.map(t=>`<div class="cnt" style="--c:${t.color}"><b>${c[t.id]||0}</b><span>${esc(t.label)}</span></div>`).join('')}</div></section>
  <section class="box"><h3>الدرجات</h3>${DB.exams.map(ex=>gradeEditor(s,ex)).join('')}</section>
  <section class="box"><h3>تفاصيل الحالات (${notes.length})</h3>
  ${notes.length?chips('nview',[['type','حسب نوع الحالة'],['date','حسب التاريخ']],S.noteView):''}
  ${!notes.length?'<p class="muted">لا توجد ملاحظات بعد</p>':S.noteView==='type'?notesByType(s).map(([t,list])=>`<div class="exam" style="border-color:color-mix(in srgb,${t.color} 40%,#fff)"><div class="row between" style="margin:0 0 4px"><b style="color:${t.color}">${esc(t.label)}</b><span class="b" style="--c:${t.color}">${list.length} ${list.length===1?'مرة':'مرات'}</span></div>
     ${list.map((n,i)=>`<div class="note"><span class="muted sm" style="min-width:18px">${i+1}.</span><span class="sm" style="white-space:nowrap">${esc(dayName(n.date))} ${fmtD(n.date)}</span><div class="grow">${n.text?esc(n.text):'<span class="muted sm">بدون تفاصيل</span>'}</div><button class="icon" data-act="delnote" data-n="${n.id}" aria-label="حذف">🗑</button></div>`).join('')}</div>`).join('')

/* --- التسجيل اليومي --- */
function vRegister(){
  const gl=gradesList();if(!gl.includes(S.regGrade))S.regGrade=gl[0];
  const secs=sectionsOf(S.regGrade);if(!secs.includes(S.regSection))S.regSection=secs[0];
  const types=DB.types.filter(t=>t.id!=='note');
  const arr=filtered(S.regGrade,S.regSection,'').sort(byName);
  const dayCount=t=>arr.filter(s=>s.notes.some(n=>n.date===S.regDate&&n.type===t)).length;
  $('#view').innerHTML=`${chips('rgrade',gl.map(g=>[g,'الصف '+g]),S.regGrade)}${chips('rsec',secs.map(x=>[x,'شعبة '+x]),S.regSection)}
  <div class="row"><span class="muted">التاريخ:</span><input type="date" id="rDate" value="${S.regDate}"><span class="muted sm" id="rsum">${arr.length} طالب · الغائبون: ${dayCount('absent')}</span></div>
  <p class="muted sm" style="margin:0 0 8px">اضغط الزر لتسجيل الحالة لهذا اليوم، واضغطه مرة ثانية لإلغائها.</p>
  ${arr.map((s,i)=>`<div class="rrow"><div class="rn"><span class="muted">${i+1}.</span> <span data-act="open" data-id="${s.id}" style="cursor:pointer">${esc(s.name)}</span></div><div class="rbtns">${types.map(t=>{const on=s.notes.some(n=>n.date===S.regDate&&n.type===t.id);return `<button class="rb ${on?'on':''}" style="--c:${t.color}" data-act="toggle" data-id="${s.id}" data-t="${t.id}">${esc(t.short)}</button>`}).join('')}</div></div>`).join('')}`;
  $('#rDate').onchange=e=>{S.regDate=e.target.value||today();vRegister()};
}

/* --- التقارير --- */
const dayName=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('ar-IQ',{weekday:'long'})}catch(e){return ''}};
function notesByType(s){const g={};for(const n of [...s.notes].sort((a,b)=>a.date.localeCompare(b.date)))(g[n.type]=g[n.type]||[]).push(n);return DB.types.filter(t=>g[t.id]).map(t=>[t,g[t.id]]).concat(Object.keys(g).filter(k=>!DB.types.find(t=>t.id===k)).map(k=>[T(k),g[k]]))}
function repData(){
  const gl=gradesList();if(!gl.includes(S.repGrade))S.repGrade=gl[0];
  const secs=sectionsOf(S.repGrade);if(S.repSection!=='all'&&!secs.includes(S.repSection))S.repSection='all';
  if(!DB.exams.find(e=>e.id===S.repExam))S.repExam=lastExam().id;
  const arr=filtered(S.repGrade,S.repSection,'').sort((a,b)=>coll.compare(a.section,b.section)||byName(a,b));
  return{gl,secs,arr};
}
function vReports(){
  const{gl,secs,arr}=repData();
  let head=`${chips('pmode',[['grades','📊 الدرجات'],['details','📋 المتابعة والسلوك']],S.repMode)}
  ${chips('pgrade',gl.map(g=>[g,'الصف '+g]),S.repGrade)}${chips('psec',[['all','كل الشعب'],...secs.map(x=>[x,'شعبة '+x])],S.repSection)}`;
  let body='';
  if(S.repMode==='grades'){
    const nums=arr.map(s=>finOf(s,S.repExam)).filter(f=>typeof f==='number');
    const avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):'-';const pass=nums.filter(f=>f>=50).length;
    body=`<div class="row between"><select id="pExam">${DB.exams.map(e=>`<option value="${e.id}" ${e.id===S.repExam?'selected':''}>${esc(e.name)}</option>`).join('')}</select><button class="btn sm" data-act="printrep">🖨 طباعة</button></div>
    <div class="row muted sm">العدد: ${arr.length} · المعدل: ${avg} · الناجحون (50 فأكثر): ${pass} · الراسبون: ${nums.length-pass}</div>
    <div class="tblwrap">${gradesTable(arr)}</div>`;
  }else{
    const tot={};arr.forEach(s=>s.notes.forEach(n=>tot[n.type]=(tot[n.type]||0)+1));
    body=`<div class="row between"><span class="muted sm">اضغط على أي طالب لرؤية تفاصيل حالاته</span><button class="btn sm" data-act="printrep">🖨 طباعة</button></div>
    <div class="cgrid" style="margin-bottom:10px">${DB.types.map(t=>`<div class="cnt" style="--c:${t.color}"><b>${tot[t.id]||0}</b><span>${esc(t.label)}</span></div>`).join('')}</div>
    <div class="tblwrap">${detailsTable(arr)}</div>`;
  }
  $('#view').innerHTML=head+body;
  if($('#pExam'))$('#pExam').onchange=e=>{S.repExam=e.target.value;vReports()};
}
function gradesTable(arr,print){
  const sec=S.repSection==='all';
  if(SINGLE)return `<table class="${print?'pt':'tbl'}"><tr><th>ت</th><th>اسم الطالب</th>${sec?'<th>الشعبة</th>':''}<th>الدرجة (100)</th></tr>
  ${arr.map((s,i)=>{const f=finOf(s,S.repExam);const low=typeof f==='number'&&f<50;return `<tr${print?'':` data-act="open" data-id="${s.id}" style="cursor:pointer"`}><td>${i+1}</td><td class="l">${esc(s.name)}</td>${sec?`<td>${esc(s.section)}</td>`:''}<td style="${low?'color:#c0392b;':''}font-weight:800">${esc(f)}</td></tr>`}).join('')}</table>`;
  return `<table class="${print?'pt':'tbl'}"><tr><th>ت</th><th>اسم الطالب</th>${sec?'<th>الشعبة</th>':''}<th>اليومي<br>(100)</th><th>النظري<br>(60)</th><th>العملي<br>(40)</th><th>الامتحان<br>(100)</th><th>النهائية<br>(100)</th></tr>
  ${arr.map((s,i)=>{const r=calc(s.scores?.[S.repExam])||{};const low=typeof r.f==='number'&&r.f<50;return `<tr${print?'':` data-act="open" data-id="${s.id}" style="cursor:pointer"`}><td>${i+1}</td><td class="l">${esc(s.name)}</td>${sec?`<td>${esc(s.section)}</td>`:''}<td>${esc(r.d??'')}</td><td>${esc(r.t??'')}</td><td>${esc(r.p??'')}</td><td>${esc(r.m??'')}</td><td style="${low?'color:#c0392b;':''}font-weight:800">${esc(r.f??'')}</td></tr>`}).join('')}</table>`;
}
function detailsTable(arr,print){
  const sec=S.repSection==='all',types=DB.types;
  return `<table class="${print?'pt':'tbl'}"><tr><th>ت</th><th>اسم الطالب</th>${sec?'<th>الشعبة</th>':''}${types.map(t=>`<th>${esc(t.short)}</th>`).join('')}<th>مجموع السلبيات</th><th>آخر ملاحظة</th></tr>
  ${arr.map((s,i)=>{const c=counts(s),neg=negTotal(s);const last=[...s.notes].sort((a,b)=>b.date.localeCompare(a.date))[0];
   return `<tr${print?'':` data-act="open" data-id="${s.id}" style="cursor:pointer"`}><td>${i+1}</td><td class="l">${esc(s.name)}</td>${sec?`<td>${esc(s.section)}</td>`:''}${types.map(t=>`<td style="${c[t.id]?`color:${t.color};font-weight:800`:''}">${c[t.id]||''}</td>`).join('')}<td style="font-weight:800;${neg>=3?'color:#c0392b':''}">${neg||''}</td><td class="sm" style="white-space:nowrap">${last?esc(T(last.type).short)+' · '+fmtD(last.date):''}</td></tr>`}).join('')}</table>`;
}

  <h4>ملخص الملاحظات</h4><table class="pt"><tr>${DB.types.map(t=>`<th>${esc(t.label)}</th>`).join('')}</tr><tr>${DB.types.map(t=>`<td>${c[t.id]||0}</td>`).join('')}</tr></table>

  <div class="sign"><span>توقيع ولي الأمر: ..................</span><span>مدرس المادة: ${esc(DB.settings.teacher)}</span></div>`;
  setTimeout(()=>window.print(),50);

function printReport(){
  const{arr}=repData();
  const ex=DB.exams.find(e=>e.id===S.repExam);
  $('#print').innerHTML=printHead(`الصف ${S.repGrade} متوسط${S.repSection==='all'?'':' / شعبة ('+S.repSection+')'} – ${S.repMode==='grades'?ex.name:'المتابعة والسلوك'}`)+(S.repMode==='grades'?gradesTable(arr,true):detailsTable(arr,true))+`<div class="sign"><span></span><span>مدرس المادة: ${esc(DB.settings.teacher)}</span></div>`;
  setTimeout(()=>window.print(),50);
}

/* ===== الأحداث ===== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(el.tagName==='A')e.preventDefault();
  const s=curId?stu(curId):null;
  switch(a){
   case 'go':{if(S.view===v)break;S.view=v;render();window.scrollTo(0,0);const vw=$('#view');vw.classList.remove('enter');vw.offsetWidth;vw.classList.add('enter');break}
   case 'fgrade':S.grade=v;S.section='all';vStudents();break;
   case 'fsec':S.section=v;vStudents();break;
   case 'rgrade':S.regGrade=v;S.regSection=null;vRegister();break;
   case 'rsec':S.regSection=v;vRegister();break;
   case 'pmode':S.repMode=v;vReports();break;
   case 'nview':S.noteView=v;renderProfile();break;
   case 'pgrade':S.repGrade=v;S.repSection='all';vReports();break;
   case 'psec':S.repSection=v;vReports();break;
   case 'open':openStudent(el.dataset.id);break;
   case 'close':closeModal();break;
   case 'addnote':{
     const text=$('#nText').value.trim(),date=$('#nDate').value||today();
     s.notes.push({id:uid(),date,type:el.dataset.t,text});persist();$('#nText').value='';
     toast('تمت الإضافة: '+T(el.dataset.t).label);renderProfile();
     const ci=DB.types.findIndex(t=>t.id===el.dataset.t);document.querySelectorAll('.sheet .cnt')[ci]?.classList.add('bump');break}
   case 'delnote':if(confirm('حذف هذه الملاحظة؟')){s.notes=s.notes.filter(n=>n.id!==el.dataset.n);persist();renderProfile()}break;
   case 'autofill':{
     const sc=s.scores[el.dataset.ex]||(s.scores[el.dataset.ex]={status:''});const m=MAP[num(sc.theory)];
     if(!m){toast('أدخل درجة النظري أولاً (من مضاعفات 5)');break}
     sc.daily=m[0];sc.practical=m[1];persist();renderProfile();toast('تمت التعبئة');break}
   case 'savestu':{
     const n=$('#eName').value.trim(),g=$('#eGrade').value.trim(),sec=$('#eSec').value.trim();
     if(!n||!g||!sec){toast('أكمل الاسم والصف والشعبة');break}
     const dup=DB.students.find(x=>x.id!==s.id&&norm(x.name)===norm(n));
     if(dup&&!confirm(`يوجد طالب بنفس الاسم في الصف ${dup.grade} شعبة ${dup.section}. حفظ على أي حال؟`))break;
     s.name=n;s.grade=g;s.section=sec;persist();renderProfile();toast('تم الحفظ');break}
   case 'delstu':if(confirm('حذف الطالب '+s.name+' وكل ملاحظاته نهائياً؟')){DB.students=DB.students.filter(x=>x.id!==s.id);persist();closeModal();toast('تم الحذف')}break;
   case 'printstu':printStudent(stu(el.dataset.id));break;
   case 'printrep':printReport();break;
   case 'toggle':{
     const st=stu(el.dataset.id),t=el.dataset.t;const i=st.notes.findIndex(n=>n.date===S.regDate&&n.type===t);
     if(i>=0)st.notes.splice(i,1);else st.notes.push({id:uid(),date:S.regDate,type:t,text:''});
     persist();el.classList.toggle('on',i<0);el.classList.remove('pop');if(i<0){el.offsetWidth;el.classList.add('pop')}
     const arr=filtered(S.regGrade,S.regSection,'');$('#rsum').textContent=`${arr.length} طالب · الغائبون: ${arr.filter(x=>x.notes.some(n=>n.date===S.regDate&&n.type==='absent')).length}`;break}
   case 'ghsave':{
     GH={owner:$('#gOwner').value.trim().replace(/^@/,''),repo:$('#gRepo').value.trim(),branch:$('#gBranch').value.trim()||'main',path:$('#gPath').value.trim()||CFG.path,token:$('#gToken').value.trim()};
     if(!ghOK()){toast('أكمل اسم الحساب والمستودع والتوكن');break}
     localStorage.setItem(LSG,JSON.stringify(GH));
     try{setSync('pending');const r=await ghFetch();
       if(r&&DB&&r!==null&&(DB.updatedAt||'')>(r.updatedAt||'')&&!confirm('النسخة على هذا الجهاز أحدث من GitHub. اضغط "موافق" لرفعها، أو "إلغاء" لتحميل نسخة GitHub.')){DB=r;localStorage.setItem(LS,JSON.stringify(DB))}
       else if(r&&(!DB||(r.updatedAt||'')>=(DB.updatedAt||''))){DB=r;localStorage.setItem(LS,JSON.stringify(DB))}
       else if(DB){await ghPush()}
       setSync('ok');toast(DB?'تم الاتصال بنجاح ✓':'تم الاتصال، لكن الملف غير موجود في المستودع');render()
     }catch(err){setSync('error',err.message);toast(err.message)}break}
   case 'ghpull':ghSync(false);break;
   case 'ghforget':if(confirm('إلغاء ربط GitHub من هذا الجهاز؟ (البيانات تبقى على GitHub)')){GH={};localStorage.removeItem(LSG);setSync('local');render()}break;
   case 'addstu':{
     const n=$('#aName').value.trim(),g=$('#aGrade').value.trim(),sec=$('#aSec').value.trim();
     if(!n||!g||!sec){toast('أكمل الاسم والصف والشعبة');break}
     const dup=DB.students.find(x=>norm(x.name)===norm(n));
     if(dup&&!confirm(`الاسم موجود مسبقاً في الصف ${dup.grade} شعبة ${dup.section}. إضافة على أي حال؟`))break;
     DB.students.push({id:uid(),name:n,grade:g,section:sec,scores:{},notes:[]});persist();toast('تمت إضافة '+n);vSettings();break}
   case 'addbulk':{
     const g=$('#aGrade').value.trim(),sec=$('#aSec').value.trim();
     const names=$('#aBulk').value.split(/\n/).map(x=>x.replace(/^[\d\s.\-–—)]+/,'').trim()).filter(Boolean);
     if(!names.length||!g||!sec){toast('اكتب الأسماء والصف والشعبة');break}
     const dups=names.filter(n=>DB.students.some(x=>norm(x.name)===norm(n)));
     if(dups.length&&!confirm('هذه الأسماء موجودة مسبقاً:\n'+dups.join('\n')+'\n\nإضافة الباقي فقط؟'))break;
     let k=0;names.forEach(n=>{if(!DB.students.some(x=>norm(x.name)===norm(n))){DB.students.push({id:uid(),name:n,grade:g,section:sec,scores:{},notes:[]});k++}});
     persist();toast('تمت إضافة '+k+' طالب');vSettings();break}
   case 'addexam':{const n=$('#exName').value.trim();if(!n)break;DB.exams.push({id:'e'+uid(),name:n});persist();vSettings();toast('تمت إضافة الامتحان');break}
   case 'delexam':if(confirm('حذف هذا الامتحان ودرجاته من كل الطلاب؟')){DB.exams=DB.exams.filter(x=>x.id!==v);DB.students.forEach(x=>delete x.scores[v]);persist();vSettings()}break;
   case 'addtype':{
     const l=$('#tLabel').value.trim();if(!l)break;const colors=['#2471a3','#a04000','#117a65','#7d3c98','#b03a2e','#5d6d7e'];
     DB.types.splice(DB.types.length-1,0,{id:'t'+uid(),label:l,short:$('#tShort').value.trim()||l,color:colors[DB.types.length%colors.length],neg:$('#tNeg').checked?1:0});persist();vSettings();break}
   case 'deltype':if(confirm('حذف هذا النوع؟ (الملاحظات المسجلة به تبقى)')){DB.types=DB.types.filter(t=>t.id!==v);persist();vSettings()}break;
   case 'savesettings':DB.settings={school:$('#sSchool').value.trim(),subject:$('#sSubject').value.trim(),teacher:$('#sTeacher').value.trim()};persist();toast('تم الحفظ');break;
   case 'export':{
     const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);
     const l=document.createElement('a');l.href=u;l.download='students-data-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;const k=el.dataset.chg;if(!k)return;
  if(k==='import'){
    const f=el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.students))throw 0;
      if(DB&&!confirm('سيتم استبدال البيانات الحالية بالملف المستورد. متابعة؟'))return;
      DB=ensure(d);persist();toast('تم استيراد '+DB.students.length+' طالب');S.view='students';render()}catch(x){toast('الملف غير صالح')}};
    rd.readAsText(f);return}
  const s=stu(curId);if(!s)return;const ex=el.dataset.ex;
  const sc=s.scores[ex]||(s.scores[ex]={status:''});
  if(k==='status'){sc.status=el.value;persist();renderProfile();return}
  if(k==='score'){
    let v=num(el.value);const max=+el.max;
    if(v!==null&&(v<0||v>max)){toast('الدرجة يجب أن تكون بين 0 و '+max);el.value=sc[el.dataset.k]??'';return}
    sc[el.dataset.k]=v;persist();renderProfile();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&curId)closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ghOK()&&!saveTimer)ghSync(true)});

/* ===== تشغيل ===== */
$('#apptitle').textContent=CFG.title;
document.fonts?.ready.then(()=>dispatchEvent(new Event('resize')));
load();if(!DB&&SINGLE){DB=ensure({students:[]});localStorage.setItem(LS,JSON.stringify(DB))}render();ghSync(true);
/* تحديث تلقائي: إذا نُشرت نسخة أحدث من الصفحة يعاد تحميلها */
async function checkUpdate(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/APP_VERSION='([^']+)'/);if(m&&m[1]!==APP_VERSION&&!curId){toast('يوجد تحديث… جاري التحميل');setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash),800)}}catch(e){}}
/* استيراد من رابط: البيانات داخل الرابط بعد # ولا تُرسل إلى أي خادم */
async function linkImport(){
  const h=location.hash;if(!h.startsWith('#d='))return false;
  try{
    const b=atob(h.slice(3).replace(/-/g,'+').replace(/_/g,'/'));const u=Uint8Array.from(b,c=>c.charCodeAt(0));
    const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    const d=JSON.parse(txt);if(!Array.isArray(d.students))throw 0;
    history.replaceState(null,'',location.pathname);
    if(DB&&DB.students.length&&!confirm('سيتم استبدال البيانات الحالية ببيانات الرابط ('+d.students.length+' طالب). متابعة؟'))return true;
    DB=ensure(d);persist();S.view='students';render();toast('تم تحميل '+DB.students.length+' طالب ✓');
  }catch(e){toast('تعذر قراءة بيانات الرابط')}
  return true;
}
linkImport().then(done=>{if(!done)checkUpdate()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
